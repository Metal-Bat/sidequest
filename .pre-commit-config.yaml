default_stages: [pre-commit]

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ui-format
        name: Format HTML and CSS
        language: system
        entry: mise run ui-format
        files: ^src/(templates/.*\.html|static/[^/]+\.(html|css))$
        pass_filenames: false
      - id: ui-lint
        name: Lint HTML and CSS
        language: system
        entry: mise run ui-lint
        files: ^(src/(templates/.*\.html|static/[^/]+\.(html|css))|scripts/lint-html\.mjs|package(-lock)?\.json|\.(htmlhintrc|stylelintrc\.json|prettierrc\.json|prettierignore))$
        pass_filenames: false

ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false
